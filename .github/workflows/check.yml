name: Check broker app
on:
  push:
    paths: ['online-broker/**', '.github/workflows/check.yml']
  pull_request:
    paths: ['online-broker/**', '.github/workflows/check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: online-broker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: online-broker/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
